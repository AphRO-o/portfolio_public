<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="徐晨昊的个人索引：老师、作者与开发者。" />
    <meta name="theme-color" content="#f5f2eb" />
    <title>徐晨昊｜个人索引</title>
    <link rel="stylesheet" href="/portal.css" />
  </head>
  <body>
    <main class="identity-index">
      <header class="index-meta"><span>PERSONAL INDEX</span></header>

      <section class="nameplate" aria-labelledby="owner-name">
        <p>CHENHAO XU</p>
        <h1 id="owner-name">徐晨昊</h1>
      </section>

      <nav class="identity-nav" aria-label="选择身份站点">
        <a class="identity-link teach" href="/teach">
          <span class="identity-number">01</span>
          <span class="identity-main"><small>TEACH</small><strong>教师</strong></span>
          <span class="identity-signature">徐老师</span>
          <span class="identity-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="identity-link write" href="/write">
          <span class="identity-number">02</span>
          <span class="identity-main"><small>WRITE</small><strong>作者</strong></span>
          <span class="identity-signature">草寸</span>
          <span class="identity-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="identity-link dev" href="/dev">
          <span class="identity-number">03</span>
          <span class="identity-main"><small>DEVELOP</small><strong>开发者</strong></span>
          <span class="identity-signature">AphRO</span>
          <span class="identity-arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </main>
  </body>
</html>
