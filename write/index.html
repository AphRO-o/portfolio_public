<html lang="zh-Hans">
  <head>

    <link rel="stylesheet" href="/write.css" />

        <div class="reading-inner">
          <header class="article-header"><p data-article-year>—</p><h2 data-article-title>正在打开书页</h2><div><span data-article-author>—</span><span data-article-date></span></div></header>
          <div class="article-body" data-article-body><p class="loading-copy">正在读取 Markdown 作品…</p></div>
          <footer class="article-end" aria-hidden="true"><i></i></footer>
        </div>
      </article>
    </main>
  </body>
